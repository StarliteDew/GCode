[package]
name = "AIApi-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", features = ["blocking", "gzip", "json"] }
russh = "0.62.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssh2 = "0.9.6"
tokio = { version = "1.53.1", features = ["full"] }